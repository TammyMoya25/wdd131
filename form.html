<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form | Tamara Moya</title>
    <meta name="description" content="Page description">
    <meta name="author" content="Tamara Moya">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <div class="form-group">
                <label for="productName">Product Name *</label>
                <select id="productName" name="productName" required>
                    <option value="" selected disabled>Select a Product ...</option>
                </select>
            </div>
            <fieldset class="rating">
                <legend>Overall Rating</legend>
                <div class="rating-group">
                    <label><input type="radio" name="rating" value="1" required> ☆</label>
                    <label><input type="radio" name="rating" value="2"> ☆☆</label>
                    <label><input type="radio" name="rating" value="3"> ☆☆☆</label>
                    <label><input type="radio" name="rating" value="4"> ☆☆☆☆</label>
                    <label><input type="radio" name="rating" value="5"> ☆☆☆☆☆</label>
                </div>
            </fieldset>
            <div class="form-group">
                <label for="installDate">Date of Installation *</label>
                <input type="date" id="installDate" name="installDate" required>
            </div>
            <fieldset>
                <legend>Useful Features</legend>
                <label>
                    <input type="checkbox" id="durability" name="features" value="Durability">
                    Durability
                </label>
                <label>
                    <input type="checkbox" id="ease" name="features" value="Ease of Use">
                    Ease of Use
                </label>
                <label>
                    <input type="checkbox" id="performance" name="features" value="Performance">
                    Performance
                </label>
                <label>
                    <input type="checkbox" id="design" name="features" value="Design">
                    Design
                </label>
            </fieldset>
            <div class="form-group">
                <label for="review">Written Review</label>
                <textarea id="review" name="review" rows="6"></textarea>
            </div>
            <div class="form-group">
                <label for="username">Your Name</label>
                <input type="text" id="username" name="username">
            </div>
            <input type="submit" value="Post Review" class="submit-btn">
        </form>
    </main>
    <footer>
        <p>
            &copy;<span id="currentyear"></span>
            Tamara Moya - Costa Rica
        </p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
