<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomad in DR | Planner</title>
    <meta name="description"
        content="Your ultimate guide to spending 1 amazing month as a digital nomad in the Dominican Republic.">
    <meta name="author" content="Tamara Moya">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/project.css">
    <script src="scripts/project.js" defer></script>
</head>

<body>
    <header>
        <div class="logo">🌴💻 Nomad in DR</div>
        <nav>
            <button id="menu-toggle" aria-label="Toggle Menu">☰</button>
            <ul id="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="destinations.html">Destinations</a></li>
                <li><a href="planner.html" class="active">Planner</a></li>
            </ul>
        </nav>
    </header>

    <main class="split-layout">
        <section class="planner-box">
            <h2>Packing Checklist</h2>
            <p>Check the items you have ready. Your progress saves automatically!</p>
            <ul id="checklist" class="todo-list">
            </ul>
        </section>

        <section class="planner-box">
            <h2>Find Your Ideal Destination</h2>
            <form id="recommendation-form" method="GET" action="#">
                <div class="form-group">
                    <label for="budget">Monthly Budget (USD):</label>
                    <input type="number" id="budget" name="budget" min="800" max="5000" placeholder="e.g. 1200"
                        required>
                </div>

                <div class="form-group">
                    <label for="vibe-preference">What do you prefer?</label>
                    <select id="vibe-preference" name="vibe-preference" required>
                        <option value="" disabled selected>Choose a style...</option>
                        <option value="city">History & City Architecture</option>
                        <option value="beach">Quiet Beautiful Beaches</option>
                        <option value="active">Nightlife and Water Sports</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Do you need a Coworking Space?</label>
                    <div class="radio-group">
                        <label><input type="radio" name="coworking" value="yes" checked> Yes</label>
                        <label><input type="radio" name="coworking" value="no"> No</label>
                    </div>
                </div>

                <button type="submit" class="btn full-width">Get Recommendation</button>
            </form>

            <div id="form-result" class="result-message hidden"></div>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> | Tamara Moya | WDD 131</p>
        <p><a href="references.html">Project References</a></p>
        <p id="last-modified"></p>
    </footer>
</body>

</html>
